<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNS Smart Slopes – System Concept (External Overview)</title>
    <!-- Tailwind & Alpine.js -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;700;900&family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --dns-primary: #0D4D5E;
            --dns-deep: #083845;
            --dns-teal: #417483;
            --dns-soft: #AAD0D1;
            --dns-bg: #F4F9F9;
        }
        body { font-family: 'Roboto', sans-serif; background-color: var(--dns-bg); color: var(--dns-primary); margin: 0; scroll-behavior: smooth; overflow-x: hidden; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Be Vietnam Pro', sans-serif; }

        /* Utility Colors */
        .bg-dns-primary { background-color: var(--dns-primary); }
        .bg-dns-deep { background-color: var(--dns-deep); }
        .text-dns-soft { color: var(--dns-soft); }
        .text-dns-teal { color: var(--dns-teal); }
        .border-dns-soft { border-color: var(--dns-soft); }
        /* Slide Layout */
        .slide-section { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 6rem 1.5rem; position: relative; border-bottom: 1px solid rgba(13, 77, 94, 0.05); }
        @media (min-width: 1024px) { .slide-section { padding: 4rem 10rem; } }
        /* Icon & Graphic Refinements */
        .wf-icon { fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }

        /* Architecture & Lifecycle Effects */
        .premium-card { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); border: 2px solid transparent; }
        .premium-card.active { border-color: var(--dns-soft); background: var(--dns-primary); color: white; transform: translateY(-5px); box-shadow: 0 25px 50px -12px rgba(13, 77, 94, 0.25); }
        .step-node { position: relative; z-index: 10; transition: all 0.4s; }
        .step-node.active { transform: scale(1.15); filter: drop-shadow(0 0 15px var(--dns-soft)); }
        .timeline-track { height: 2px; background: linear-gradient(90deg, transparent, var(--dns-teal) 15%, var(--dns-teal) 85%, transparent); opacity: 0.2; }
        /* Animations */
        .radar-rotate { animation: rotate 5s linear infinite; transform-origin: center; }
        @keyframes geoMove { 0% { offset-distance: 0%; } 100% { offset-distance: 100%; } }
        .geo-tracker {
            position: absolute; top: 0; left: 0; width: 0; height: 0;
            offset-path: path('M -20,60 C 80,95 120,140 160,160 C 200,180 260,215 340,255');
            animation: geoMove 9s linear infinite;
        }
        @keyframes geoDotState {
            0%, 22%   { background-color: var(--dns-teal); box-shadow: 0 0 0 0 rgba(13,77,94,0); }
            30%, 70%  { background-color: var(--dns-primary); box-shadow: 0 0 0 6px rgba(13,77,94,0.15); }
            78%, 100% { background-color: var(--dns-teal); box-shadow: 0 0 0 0 rgba(13,77,94,0); }
        }
        .geo-tracker-dot {
            position: absolute; top: -11px; left: -11px; width: 22px; height: 22px;
            border-radius: 9999px; border: 4px solid #ffffff;
            animation: geoDotState 9s linear infinite;
        }
        @keyframes geoPulseState {
            0%, 24%   { opacity: 0; transform: scale(0.5); }
            30%, 70%  { opacity: 1; transform: scale(1); }
            76%, 100% { opacity: 0; transform: scale(0.5); }
        }
        .geo-tracker-pulse {
            position: absolute; top: -20px; left: -20px; width: 40px; height: 40px;
            border-radius: 9999px; border: 2px solid var(--dns-primary);
            animation: geoPulseState 9s linear infinite, blip 1.6s infinite;
        }
        @keyframes geoBadgeOn {
            0%, 24%   { opacity: 0; transform: translate(-50%, 6px); }
            30%, 70%  { opacity: 1; transform: translate(-50%, 0); }
            76%, 100% { opacity: 0; transform: translate(-50%, 6px); }
        }
        @keyframes geoBadgeOff {
            0%, 20%   { opacity: 1; transform: translate(-50%, 0); }
            26%, 74%  { opacity: 0; transform: translate(-50%, -6px); }
            80%, 100% { opacity: 1; transform: translate(-50%, 0); }
        }
        .geo-tracker-badge { position: absolute; top: -44px; left: 11px; font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; padding: 6px 14px; border-radius: 9999px; white-space: nowrap; }
        .geo-tracker-badge.on  { background-color: var(--dns-primary); color: var(--dns-soft); animation: geoBadgeOn 9s linear infinite; }
        .geo-tracker-badge.off { background-color: #ffffff; color: var(--dns-teal); border: 1.5px solid var(--dns-teal); animation: geoBadgeOff 9s linear infinite; }
        @keyframes geoBoundaryFlash {
            0%, 23%, 27%, 73%, 77%, 100% { border-color: rgba(65,116,131,0.1); }
            25%, 75% { border-color: rgba(13,77,94,0.5); }
        }
        .geo-boundary { animation: geoBoundaryFlash 9s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .shadow-3xl { box-shadow: 0 35px 60px -15px rgba(0, 0, 0, 0.3); }
        @keyframes blip { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.8); opacity: 0; } 100% { transform: scale(1); opacity: 0; } }
        .gps-blip { position: absolute; width: 12px; height: 12px; border-radius: 9999px; background-color: var(--dns-soft); box-shadow: 0 0 10px 2px rgba(170, 208, 209, 0.6); }
        .gps-blip::after { content: ''; position: absolute; inset: 0; border-radius: 9999px; background-color: var(--dns-soft); animation: blip 2s infinite; }
        [x-cloak] { display: none !important; }

        /* ============ LOGO ============ */
        .dns-logo-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
        .dns-logo { display: block; aspect-ratio: 835 / 315; height: auto; }
        .dns-lg-a { fill: #8FB9B8; }
        .dns-lg-b { fill: var(--dns-primary); }
        /* variante per fondo scuro */
        .dns-logo-inv .dns-lg-a { fill: var(--dns-soft); }
        .dns-logo-inv .dns-lg-b { fill: #FFFFFF; }

        /* ============ SCALA TIPOGRAFICA UNIFICATA ============ */
        .s-h1 { font-size: clamp(2.75rem, 6.2vw, 4.75rem); font-weight: 900; line-height: 0.9; letter-spacing: -0.035em; margin-bottom: 3rem; }
        .s-h2 { font-size: clamp(1.9rem, 3.4vw, 3rem); font-weight: 900; line-height: 1.03; letter-spacing: -0.03em; text-transform: uppercase; margin-bottom: 1.5rem; }
        .s-h2-solo { margin-bottom: 3.75rem; }
        .s-lead { font-size: clamp(1.05rem, 1.35vw, 1.3rem); font-weight: 300; line-height: 1.62; max-width: 46rem; margin-bottom: 3.5rem; }
        .s-lead-tight { margin-bottom: 2.5rem; }
        .s-stat { font-size: clamp(1.7rem, 2.6vw, 2.35rem); font-weight: 900; letter-spacing: -0.03em; line-height: 1.1; }

        /* ============ COMPARSA CON LO SCROLL ============ */
        [data-rv] {
            opacity: 0; transform: translateY(26px) scale(0.995);
            transition: opacity .75s cubic-bezier(.16,.84,.44,1), transform .75s cubic-bezier(.16,.84,.44,1);
            transition-delay: var(--rv-d, 0ms); will-change: opacity, transform;
        }
        [data-rv].rv-in { opacity: 1; transform: none; }
        @media (prefers-reduced-motion: reduce) {
            [data-rv], [data-rv].rv-in { opacity: 1 !important; transform: none !important; transition: none !important; }
            html { scroll-behavior: auto !important; }
        }

        /* ============ SCORRIMENTO ============ */
        html { scroll-snap-type: y proximity; }
        .slide-section { scroll-snap-align: start; scroll-snap-stop: normal; }

        /* barra di avanzamento */
        .progress-rail { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 120; background: rgba(13,77,94,0.08); }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--dns-teal), var(--dns-soft)); transition: width .15s linear; }

        /* pulsante autoplay */
        .ctrl-btn { transition: all .3s; }
        .ctrl-btn:hover { transform: scale(1.08); }
        @keyframes ringPulse { 0% { box-shadow: 0 0 0 0 rgba(170,208,209,.55); } 70% { box-shadow: 0 0 0 12px rgba(170,208,209,0); } 100% { box-shadow: 0 0 0 0 rgba(170,208,209,0); } }
        .ctrl-btn.playing { animation: ringPulse 2.2s infinite; }

        /* alleggerimento grafico: velo sfumato sulle slide chiare */
        .slide-section.bg-white::before,
        .slide-section.bg-dns-bg::before {
            content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 0;
            background: radial-gradient(120% 80% at 88% 8%, rgba(170,208,209,0.20), transparent 60%);
        }
        .slide-section > * { position: relative; z-index: 1; }
        /* Typographic scale for sub-headings/paragraphs (h3-h6, p) — 5 semantic roles, one size each. */
        .dns-eyebrow      { font-size: 0.6875rem; }
        .dns-item-title   { font-size: 0.9375rem; }
        .dns-item-desc    { font-size: 0.875rem; }
        .dns-detail-title { font-size: 1.875rem; }
        .dns-detail-desc  { font-size: 1.25rem; }
        .slide-dot { background-color: var(--dns-primary); border: 2px solid #ffffff; box-shadow: 0 0 0 1px rgba(8, 56, 69, 0.25); }
        /* Inspector: controller-assisted validation */
        @keyframes inspectorSweep { 0%,100% { opacity:.25; } 50% { opacity:1; } }
        .inspector-cone { animation: inspectorSweep 3s ease-in-out infinite; }

        /* Genesi del confine: il poligono si disegna dalla traccia GPX, una sola volta */
        .geo-genesis-path {
            fill: rgba(13,77,94,0.10);
            stroke: var(--dns-primary);
            stroke-width: 2.5;
            stroke-dasharray: 1;
            stroke-dashoffset: 1;
            fill-opacity: 0;
            transition: stroke-dashoffset 2s cubic-bezier(.16,.84,.44,1),
                        fill-opacity 1.3s ease 1.4s;
        }
        .geo-genesis-path.geo-drawn { stroke-dashoffset: 0; fill-opacity: 1; }
        @media (prefers-reduced-motion: reduce) {
            .geo-genesis-path { transition: none; stroke-dashoffset: 0; fill-opacity: 1; }
        }
    </style>
</head>

        function dnsDeck() {
            return {
                lang: 'de', activeLayer: 0, activeStep: 0, activeGeo: 0, activeControl: 0,
                activeFin: 0, activeGov: 0, activeKPI: 0, activeRoad: 0, activeProof: 0, activePartner: 0, activeCarrier: 0, activeOpp: 0, activeProblem: 0,
                activeSlide: 1, totalSlides: 12,
                progress: 0, autoplay: false, autoTimer: null, autoMs: 15000,

                init() {
                    const sections = document.querySelectorAll('.slide-section[id^="slide-"]');
                    this.totalSlides = sections.length;

                    /* --- slide attiva --- */
                    const nav = new IntersectionObserver((entries) => {
                        entries.forEach(entry => {
                            if (entry.isIntersecting) {
                                this.activeSlide = parseInt(entry.target.id.replace('slide-', ''));
                            }
                        });
                    }, { rootMargin: '-50% 0px -50% 0px', threshold: 0 });
                    sections.forEach(el => nav.observe(el));

                    /* --- comparsa progressiva degli elementi --- */
                    const rv = new IntersectionObserver((entries) => {
                        entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('rv-in'); rv.unobserve(e.target); } });
                    }, { rootMargin: '0px 0px -12% 0px', threshold: 0.08 });

                    sections.forEach(sec => {
                        let targets = Array.from(sec.children);
                        // la prima slide ha un wrapper: scendi di un livello
                        if (targets.length && targets.length <= 2 && targets[0].children.length > 2) {
                            targets = Array.from(targets[0].children);
                        }
                        targets = targets.filter(el => !el.className || !String(el.className).includes('absolute'));
                        targets.forEach((el, i) => {
                            el.setAttribute('data-rv', '');
                            el.style.setProperty('--rv-d', Math.min(i * 95, 480) + 'ms');
                            rv.observe(el);
                        });
                    });

                    /* --- genesi del confine: si disegna una sola volta all'ingresso nella slide Geofencing --- */
                    const geoPath = document.getElementById('geo-genesis-path');
                    const geoSlide = document.getElementById('slide-6');
                    if (geoPath && geoSlide) {
                        const go = new IntersectionObserver((entries) => {
                            entries.forEach(e => { if (e.isIntersecting) { geoPath.classList.add('geo-drawn'); go.unobserve(e.target); } });
                        }, { threshold: 0.35 });
                        go.observe(geoSlide);
                    }

                    /* --- barra di avanzamento --- */
                    const upd = () => {
                        const h = document.documentElement.scrollHeight - window.innerHeight;
                        this.progress = h > 0 ? Math.min(100, (window.scrollY / h) * 100) : 0;
                    };
                    window.addEventListener('scroll', upd, { passive: true });
                    window.addEventListener('resize', upd);
                    upd();

                    /* --- tastiera --- */
                    window.addEventListener('keydown', (e) => {
                        if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') {
                            e.preventDefault(); this.stopAuto();
                            this.goToSlide(Math.min(this.activeSlide + 1, this.totalSlides));
                        } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
                            e.preventDefault(); this.stopAuto();
                            this.goToSlide(Math.max(this.activeSlide - 1, 1));
                        } else if (e.key === 'Escape') { this.stopAuto(); }
                    });

                    /* --- interazione manuale mette in pausa --- */
                    ['wheel', 'touchstart', 'mousedown'].forEach(ev =>
                        window.addEventListener(ev, () => { if (this.autoplay) this.stopAuto(); }, { passive: true })
                    );
                },

                goToSlide(n) {
                    document.getElementById('slide-' + n)?.scrollIntoView({ behavior: 'smooth' });
                },

                toggleAuto() { this.autoplay ? this.stopAuto() : this.startAuto(); },

                startAuto() {
                    this.autoplay = true;
                    this.autoTimer = setInterval(() => {
                        if (this.activeSlide >= this.totalSlides) { this.stopAuto(); return; }
                        this.goToSlide(this.activeSlide + 1);
                    }, this.autoMs);
                },

                stopAuto() {
                    this.autoplay = false;
                    if (this.autoTimer) { clearInterval(this.autoTimer); this.autoTimer = null; }

                    de: {
                        s1_tag: "Project Scope & Strategy",
                        s1_title: "DNS Digitale <br>Infrastruktur-<span class='text-dns-soft'>Plattform</span>",
                        s1_desc: "Ziel ist nicht die Digitalisierung des Verkaufs, sondern der Infrastruktur. Eine Plattform für intelligente Zugangssteuerung und Datenhoheit der Smart Slopes.",


                        sQ_title: "Die heutige Ausgangslage",
                        sQ_lead: "Bevor wir über Lösungen sprechen, lohnt sich ein Blick darauf, wo wir stehen.",
                        sQ_points: [
                            { icon: '<path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>', t: "Alles auf Papier", d: "Druck, Verteilung, verstreuter Verkauf an den Verkaufsstellen, manuelle Abrechnung. Eine Arbeit, die sich jede Saison in acht Regionen wiederholt." },
                            { icon: '<path d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>', t: "Wir wissen, was wir verkaufen — nicht, wer läuft", d: "Wir kennen die verkauften Tickets. Wir wissen nicht, wie viele Personen tatsächlich auf der Loipe sind, wann und in welchem Bereich. Netzentscheidungen beruhen auf Schätzungen." },
                            { icon: '<path d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/>', t: "Die Kontrolle hält alle an und erfasst wenige", d: "Das Personal muss jede Person anhalten, um ein Stück Papier zu prüfen. Das kostet, bremst den Gast, erzeugt Reibung — und erfasst dennoch nur einen Bruchteil." },
                            { icon: '<path d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4"/>', t: "Flexible Produkte unmöglich", d: "Halbtag, nicht zusammenhängende Mehrtagespässe, Nebensaisontarife: auf Papier nicht handhabbar. Das Angebot bleibt starr, weil das Instrument starr ist." }
                        ],
                        sQ_root: "Der strukturelle Grund ist ein einziger: <strong class='text-dns-soft'>Die Loipen kosten täglich Pflege, doch der Zugang ist faktisch nicht kontrollierbar.</strong> Das ist kein DNS-Problem — es ist das Problem jeder Outdoor-Infrastruktur ohne Drehkreuze.",

                            { icon: '<path d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 9v1m0-9c-1.11 0-2.08.402-2.599 1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>', t: "Verkauf auf der Loipe", d: "Findet das Kontrollpersonal jemanden ohne Pass, wird dieser vom selben Telefon aus ausgestellt und kassiert — Zahlung per Link über die bestehende Verkaufsplattform, Bargeld als Offline-Rückfallebene. Der Preis vor Ort enthält einen Aufschlag, den die Region festlegt." }
                        ],

                        s6_title: "Kein Experiment",
                        s6_lead: "Die einzelnen Bausteine sind anderswo im Regelbetrieb. Neu ist ihre Kombination und die Anwendung auf eine Infrastruktur ohne Drehkreuze.",
                        s6_proofs: [
                            { icon: '<path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>', t: "Digitaler Pass", where: "Schweiz · seit 2017/18", d: "Rund 120 Loipenorganisationen nutzen einen digitalen Pass mit Kontrolle durch Aufsichtspersonal." },
                            { icon: '<path d="M5 12h14M12 5l7 7-7 7"/>', t: "Digitales Ticketing", where: "Trentino · seit 2022", d: "Ein Langlaufzentrum in unserer Nähe nutzt digitales Ticketing, allerdings mit RFID-Hardware — dem Ansatz, den wir bewusst nicht wählen." },
                            { icon: '<path d="M12 2a10 10 0 100 20 10 10 0 000-20zM2 12h20M12 2a15 15 0 010 20 15 15 0 010-20z"/>', t: "Geofence als Auslöser", where: "7 EU-Länder · über 10 Jahre", d: "Die satellitengestützte LKW-Maut rechnet beim Passieren virtueller Grenzen ab, ganz ohne Infrastruktur am Straßenrand." }
                        ],
                        s6_conclusion: "Der alpine Skisport hat den bezahlten Zugang über <strong>Drehkreuze an den Liften</strong> gelöst. Alles ohne physischen Engpass — Loipen, gepflegte Trails, betreute Naturräume — hatte bisher keine Antwort. <strong class='text-dns-soft'>Genau dort setzt unser Ansatz an.</strong>",


                        s7_title: "Clearing & LTS",
                        s7_api: "Unidirektionale eingehende Synchronisation",
                        s7_items: [
                            { t: "Zahlungsfluss", d: "LTS agiert als Vermittler mit Inkassorecht: kassiert, behält 8 % ein und zahlt bis zum 10. des Folgemonats an die Regionen aus. DNS und der Anbieter berühren das Geld nie." },
                            { t: "Datenhoheit", d: "Strikte Trennung: LTS und die Regionen halten die Identität, der Technologiepartner erhält nur einen pseudonymen Code (Digital Pass ID)." },
                            { t: "Zu verhandeln", d: "Noch offen ist, ob der Zugang zu den technischen Schnittstellen in den 6 % Provision enthalten ist. Für den Machbarkeitstest unerheblich, im Vollbetrieb relevant." }
                        ],

                        s8_title: "Governance & Absicherung",
                        s8_lead: "Bedingungen, die vor der ersten Zeile Code zu klären sind — danach lassen sie sich kaum noch ändern.",
                        s8_items: [
                            { icon: '<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>', t: "IP-Eigentum", d: "Für von DNS beauftragte Entwicklungen: Eigentum oder eine unbefristete, unwiderrufliche, übertragbare und lizenzgebührenfreie Lizenz, die die Vertragsbeendigung überdauert. Die Kernplattform bleibt beim Anbieter. Das Stufe-0-Angebot erkennt dies bereits schriftlich an: Architektur, Vier-Schichten-Modell und Pseudonymisierung werden ausdrücklich DNS zugeschrieben." },
                            { icon: '<path d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>', t: "Daten & Portabilität", d: "DNS ist Eigentümerin der Daten, mit vollständigem Export in einem offenen, dokumentierten Format im Falle eines Ausstiegs. Auf kartografischer Seite ist der Punkt bereits gelöst: Bei Contwise Maps verbleiben die Datenrechte vollständig beim Kunden, der über Lizenzen, Weitergabe und Kanäle entscheidet." },
                            { icon: '<path d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/>', t: "Store-Konten", d: "Die App-Store- und Google-Play-Konten laufen auf DNS, der Anbieter arbeitet als beauftragter Entwickler. Die App bleibt unsere." },
                            { icon: '<path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>', t: "Kontinuität", d: "Quellcode-Hinterlegung, Meldepflicht bei Kontrollwechsel und Preisdeckelung: verbindlich für die Produktionsphase." }
                        ],

                        s9_title: "Was der Test beweisen muss",
                        s9_lead: "Der Machbarkeitstest dient dazu, vier Fragen zu beantworten — nicht dazu, ein Produkt zu bauen.",
                        s9_kpis: [
                            { icon: '<path d="M5 13l4 4L19 7"/>', t: "Store-Zulassung", d: "Wird die App auf iOS und Android mit Standortzugriff im Hintergrund zugelassen? Das ist keineswegs selbstverständlich." },
                            { icon: '<path d="M12 8v4l3 3"/>', t: "Akku", d: "Welches GPS-Intervall liefert brauchbare Daten, ohne den Akku an einem Wintertag zu leeren? Das ist die Variable, die alles entscheidet." },
                            { icon: '<path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0"/>', t: "Zuverlässigkeit", d: "Funktioniert die Erkennung unter realen Bedingungen: Kälte, Baumbestand, tatsächliches Gelände." },
                            { icon: '<path d="M12 9v2m0 4h.01M5 19h14a2 2 0 001.84-2.75L13.74 4a2 2 0 00-3.48 0L3.16 16.25A2 2 0 005 19z"/>', t: "Unerwartete Einschränkungen", d: "Welche Grenzen zeigen sich im Feld, die in der Planung nicht sichtbar waren — der Punkt, den kein Dokument vorwegnehmen kann." }
                        ],

                        s10_title: "Stufenweiser Weg",
                        s10_lead: "Eine Entscheidung nach der anderen, jede klein und umkehrbar. Den Rhythmus gibt die Saison vor: eine Stufe pro Winter.",
                        s10_loc: "Pilotregion noch zu bestätigen",
                        s10_stages: [
                            { when: "Winter 2026-27", t: "Stufe 0 · Machbarkeit", d: "Kick-off im Oktober 2026: minimaler Aufbau auf wenigen Geräten bis Dezember, danach Einreichung in den App-Stores und Feldtest in Planica zwischen Dezember und Januar. Keine fertige App, keine echten Nutzer. Ergebnis: Bericht mit belastbaren Messwerten und DNS-Workshop im Februar 2027." },
                            { when: "Frühjahr 2027", t: "Auswertung", d: "Analyse der Ergebnisse, Antwort auf die Frage der laufenden Kosten und, sofern das Bild trägt, Vorbereitung eines europäischen Förderantrags." },
                            { when: "Winter 2027-28", t: "Stufe 1 · Beta", d: "Beta mit echten Nutzern: eine Region, ein Tarif, rund 50 Testpersonen. Nur wenn Stufe 0 erfolgreich war." },
                            { when: "Ab 2028", t: "Phase 2 · Produktion", d: "Ausweitung auf mehrere Regionen, bidirektionale Integration und Zusatzdienste rund um den Pass." }
                        ],

                    },

                    /* ============================ ENGLISH ============================ */
                    en: {
                        s1_tag: "Project Scope & Strategy",
                        s1_title: "DNS Digital <br>Infrastructure <span class='text-dns-soft'>Platform</span>",
                        s1_desc: "The goal is not to digitise sales, but the infrastructure itself. A platform for intelligent access control and data sovereignty across the Smart Slopes.",


                        sQ_title: "The Problem Today",
                        sQ_lead: "Before talking about solutions, it is worth looking at where we start from.",
                        sQ_points: [
                            { icon: '<path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>', t: "Everything on paper", d: "Printing, distribution, fragmented sales across outlets, manual reconciliation. Work that repeats every season across eight regions." },
                            { icon: '<path d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>', t: "We know what we sell, not who skis", d: "We know the tickets sold. We do not know how many people are actually on the tracks, when, or in which area. Network decisions rest on estimates." },
                            { icon: '<path d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/>', t: "Control stops everyone and catches few", d: "Staff must stop every person to check a piece of paper. It is costly, slows the guest, creates friction — and still catches only a fraction." },
                            { icon: '<path d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4"/>', t: "Flexible products impossible", d: "Half-day, non-consecutive multi-day, low-season rates: unmanageable on paper. The offer stays rigid because the instrument is rigid." }
                        ],
                        sQ_root: "There is one structural reason: <strong class='text-dns-soft'>the tracks cost money to groom every day, yet access is effectively impossible to control.</strong> This is not a DNS problem — it is the problem of all outdoor infrastructure without turnstiles.",

                        s2_title: "Federated Architecture",
                        s2_layers: [
                            { icon: '<path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5"/>', title: "1. Commerce", owner: "LTS · Regions", desc: "Managed through LTS TIC-Web. Sales, collection and VAT stay with the regions. The technology partner never touches the payment flow." },
                            { icon: '<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>', title: "2. Identity", owner: "Technology partner", desc: "Pseudonymised Digital Pass. A sharp split between identity — which stays with LTS and the regions — and the right of access." },
                            { icon: '<path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0"/>', title: "3. Infrastructure", owner: "DNS · General Solutions", desc: "Geofencing and Infrastructure Session. The boundary geometry is generated from the regions' GPX data by General Solutions on the Contwise Maps platform and served through a GeoJSON interface. It stays outside the ticketing vendor's stack." },
                            { icon: '<path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2"/>', title: "4. Intelligence", owner: "DNS Sovereignty", desc: "Aggregated analytics and Destination Intelligence for network decisions based on real visitor-flow data." }
                        ],

                        s3_title: "Lifecycle / Session",
                        s3_stepword: "Step",
                        s3_steps: [
                            { icon: '<path d="M3 3h18v18H3zM3 9h18"/>', label: "Purchase", detail: "Online purchase through LTS. Revenue stays with the regions; the system only receives the sales event." },
                            { icon: '<path d="M12 2v20M2 12h20"/>', label: "Arrival", detail: "The guest arrives in the area with the pass already loaded in the app." },
                            { icon: '<path d="M11 19l-7-7 7-7"/>', label: "Entry", detail: "Entry into the geofence is detected and prepares the session to open." },
                            { icon: '<path d="M13 10V3L4 14h7v7l9-11h-7z"/>', label: "Session", detail: "The Infrastructure Session opens: it legally delimits the processing of location data." },
                            { icon: '<path d="M13 5l7 7-7 7"/>', label: "Exit", detail: "On leaving the area the session closes automatically — privacy and battery life." },
                            { icon: '<path d="M5 3v18l15-9z"/>', label: "End", detail: "Confirmed data is aggregated anonymously for network statistics." }
                        ],


                        sT_title: "The Pass and Freedom of Choice",
                        sT_lead: "One code, and the guest chooses the carrier. Validation works in every case — only the method differs.",
                        sT_carriers: [
                            { icon: '<path d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/>', t: "DNS app", who: "Season and weekly passes", d: "For those who want the rest: automatic session start, validation without stopping, personal statistics and, later, services attached to the pass." },
                            { icon: '<path d="M3 10h18M7 15h.01M3 7a2 2 0 012-2h14a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/>', t: "Digital wallet", who: "Those who don't want the app", d: "The QR code in the phone wallet, like any other ticket. No app, no GPS, no tracking. The controller stops and scans." },
                            { icon: '<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>', t: "Existing guest cards", who: "Visitors · later stage", d: "The pass travels on a carrier the guest already holds. Requires agreement with the card operator: a prospect, not a pilot item." }
                        ],
                        sT_freedom: "<strong class='text-dns-soft'>Nobody has to accept tracking in order to go skiing.</strong> GPS is what you receive in exchange for convenience — validation without stopping, statistics, services — not a condition of access. In both cases the controller performs the validation.",

                        sO_title: "What It Opens Up",
                        sO_lead: "Not a new project, but the next layer of E-DNS: same network, same partners, same map. On top of it we add access and data.",
                        sO_chain: [
                            { step: "Done", t: "E-DNS", d: "Shared map and communication across the eight regions." },
                            { step: "Now", t: "Smart Slopes", d: "Digital access and real usage data on the same map." },
                            { step: "Next", t: "Services", d: "Value for the guest and revenue for the regions on the same pass." }
                        ],
                        sO_groups: [
                            { tag: "Immediate · near certain", t: "Inside the network", points: [
                                "The end of paper: printing, distribution, reconciliation",
                                "Real usage data per region: the FAIR model fed by measurement rather than estimates",
                                "Faster, less confrontational control: only those who don't appear are stopped",
                                "Safety: knowing in real time that someone is on the track"
                            ]},
                            { tag: "Plausible · this is where the money is", t: "Revenue for the regions", points: [
                                "Products impossible on paper: half-day, multi-day, low season, first tracks",
                                "Services attached to the pass: lockers, rental, ski school, hospitality",
                                "Revenue stays with the region and the local partner; DNS provides the technical capability",
                                "Summer extension where a service exists: maintained trails, not free-access footpaths"
                            ]},
                            { tag: "Strategic · to be built", t: "Return for DNS", points: [
                                "DNS does not sell software and does not take revenue from tickets: it has neither the structure nor the role",
                                "What DNS owns is the design of the system",
                                "If the design is reused outside the network, DNS participates through a share or preferential terms",
                                "Replicability is precisely what European programmes fund"
                            ]}
                        ],
                        sO_bridge: "The potential economic benefit must be assessed using actual usage data, reliable benchmarks and operating-cost analysis. Future revenue is not guaranteed.",
                        sO_note_label: "A necessary clarification",
                        sO_note: "Further development stages will be decided only after the feasibility-test results and a separate economic review.",
                        s4_title: "Operational Geofencing",
                        s4_badge_on: "Session active",
                        s4_badge_off: "No processing",
                        s4_note: "The boundary geometry comes from General Solutions · Contwise Maps and never changes automatically",
                        s4_points: [
                            { icon: '<path d="M13 10V3L4 14h7v7l9-11h-7z"/>', t: "Automatic activation", d: "The session opens and closes on entering and leaving the perimeter. The guest does nothing." },
                            { icon: '<path d="M12 8v4l3 3"/>', t: "Battery consumption", d: "The critical variable to measure: sampling must be optimised for cold weather and long days." },
                            { icon: '<path d="M9 12l2 2 4-4"/>', t: "Legal basis", d: "The session delimits the legal perimeter for processing location data." },
                            { icon: '<path d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>', t: "Geometry from Contwise Maps", d: "Polygons are generated from the regions' GPX data by General Solutions on the Contwise Maps platform and served through an existing GeoJSON interface, together with real-time grooming status. They remain with DNS and the regions." }
                        ],

                        s5_title: "Controller-Assisted Validation",
                        s5_lead: "The geofence is not an automatic turnstile: it establishes a presumption of presence. The official record is created when the controller confirms.",
                        s5_device: "Controller view · active passes nearby",
                        s5_features: [
                            { icon: '<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>', t: "Presumption", d: "The system flags active passes in the area. That is an indication, not yet a validation." },
                            { icon: '<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>', t: "Human confirmation", d: "The controller, standing at a natural chokepoint on the track, confirms in the app. Only then does the record become official." },
                            { icon: '<path d="M12 9v2m0 4h.01M5 19h14a2 2 0 001.84-2.75L13.74 4a2 2 0 00-3.48 0L3.16 16.25A2 2 0 005 19z"/>', t: "False positives don't matter", d: "Someone inside the area who isn't skiing is never confirmed: no wrongful charge, even with a wide geofence." },
                            { icon: '<path d="M12 4v1m6 11h2M4 16H2m14.24-6.24l1.42-1.42M6.34 9.76L4.92 8.34"/>', t: "QR fallback", d: "Where there is no signal, or for guests who decline location, offline QR checking remains." },
                            { icon: '<path d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 9v1m0-9c-1.11 0-2.08.402-2.599 1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>', t: "Selling on the track", d: "If the controller finds someone without a pass, it is issued and paid for from the same phone — payment by link through the existing sales platform, with cash as the offline safety net. The on-the-spot price carries a supplement, set by the region." }
                        ],

                        s6_title: "Not an Experiment",
                        s6_lead: "The individual building blocks are already in operation elsewhere. What is new is their combination, applied to infrastructure without turnstiles.",
                        s6_proofs: [
                            { icon: '<path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>', t: "Digital pass", where: "Switzerland · since 2017/18", d: "Around 120 cross-country trail organisations use a digital pass validated by supervising staff." },
                            { icon: '<path d="M5 12h14M12 5l7 7-7 7"/>', t: "Digital ticketing", where: "Trentino · since 2022", d: "A cross-country centre close to us uses digital ticketing, but with RFID hardware — the approach we have deliberately not chosen." },
                            { icon: '<path d="M12 2a10 10 0 100 20 10 10 0 000-20zM2 12h20M12 2a15 15 0 010 20 15 15 0 010-20z"/>', t: "Geofence as trigger", where: "7 EU countries · over 10 years", d: "Satellite-based truck tolling charges at virtual gantries, with no roadside infrastructure at all." }
                        ],
                        s6_conclusion: "Alpine skiing solved paid access with <strong>turnstiles at the lifts</strong>. Everything without a physical chokepoint — cross-country, maintained trails, managed natural areas — has never had an answer. <strong class='text-dns-soft'>That is precisely where our approach sits.</strong>",


                        s7_title: "Clearing & LTS",
                        s7_api: "Unidirectional inbound synchronisation",
                        s7_items: [
                            { t: "Payment flow", d: "LTS acts as intermediary with the right of collection: it collects, retains 8% and settles to the regions by the 10th of the following month. DNS and the vendor never touch the money." },
                            { t: "Data sovereignty", d: "A sharp split: LTS and the regions hold identity, the technology partner receives only a pseudonymous code (Digital Pass ID)." },
                            { t: "Still to negotiate", d: "It is not yet clear whether access to the technical interfaces is included in the 6% commission. Irrelevant for the feasibility test, material at full scale." }
                        ],

                        s8_title: "Governance & Protection",
                        s8_lead: "Conditions to settle before a single line of code is written — afterwards they become very hard to change.",
                        s8_items: [
                            { icon: '<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>', t: "IP ownership", d: "For development DNS commissions: ownership, or a perpetual, irrevocable, transferable and royalty-free licence surviving termination. The vendor's core platform remains entirely theirs. The Stage 0 offer already acknowledges this in writing: the architecture, the four-layer model and the pseudonymisation are expressly attributed to DNS." },
                            { icon: '<path d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>', t: "Data & portability", d: "DNS is the data owner, with a full export in an open, documented format on exit. On the mapping side this is already settled: with Contwise Maps the data rights remain entirely with the customer, who decides on licensing, sharing and channels." },
                            { icon: '<path d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/>', t: "Store accounts", d: "App Store and Google Play accounts are held by DNS, with the vendor as delegated developer. The app stays ours." },
                            { icon: '<path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>', t: "Continuity", d: "Source-code escrow, change-of-control notice and price capping: mandatory for the production phase." }
                        ],

                        s9_title: "What the Test Must Prove",
                        s9_lead: "The feasibility test exists to answer four questions — not to build a product.",
                        s9_kpis: [
                            { icon: '<path d="M5 13l4 4L19 7"/>', t: "Store approval", d: "Will the app be approved on iOS and Android with background location access? That is far from certain." },
                            { icon: '<path d="M12 8v4l3 3"/>', t: "Battery", d: "Which GPS interval produces usable data without draining the battery on a winter day? This is the variable that decides everything." },
                            { icon: '<path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0"/>', t: "Geofence reliability", d: "Does detection work in real conditions: cold, tree cover, actual terrain." },
                            { icon: '<path d="M12 9v2m0 4h.01M5 19h14a2 2 0 001.84-2.75L13.74 4a2 2 0 00-3.48 0L3.16 16.25A2 2 0 005 19z"/>', t: "Unexpected constraints", d: "What limits show up on the ground that weren't visible at the design stage — the one thing no document can anticipate." }
                        ],
