<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNS Digital Infrastructure - Smart Slopes 2026</title>
    <!-- Tailwind & Alpine.js -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;700;900&family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --dns-primary: #0D4D5E;
            --dns-deep: #083845;
            --dns-teal: #417483;
            --dns-soft: #AAD0D1;
            --dns-bg: #F4F9F9;
        }
        body { font-family: 'Roboto', sans-serif; background-color: var(--dns-bg); color: var(--dns-primary); margin: 0; scroll-behavior: smooth; overflow-x: hidden; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Be Vietnam Pro', sans-serif; }

        /* Utility Colors */
        .bg-dns-primary { background-color: var(--dns-primary); }
        .bg-dns-deep { background-color: var(--dns-deep); }
        .text-dns-soft { color: var(--dns-soft); }
        .text-dns-teal { color: var(--dns-teal); }
        .border-dns-soft { border-color: var(--dns-soft); }
        /* Slide Layout */
        .slide-section { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 6rem 1.5rem; position: relative; border-bottom: 1px solid rgba(13, 77, 94, 0.05); }
        @media (min-width: 1024px) { .slide-section { padding: 4rem 10rem; } }
        /* Icon & Graphic Refinements */
        .wf-icon { fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }

        /* Architecture & Lifecycle Effects */
        .premium-card { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); border: 2px solid transparent; }
        .premium-card.active { border-color: var(--dns-soft); background: var(--dns-primary); color: white; transform: translateY(-5px); box-shadow: 0 25px 50px -12px rgba(13, 77, 94, 0.25); }
        .step-node { position: relative; z-index: 10; transition: all 0.4s; }
        .step-node.active { transform: scale(1.15); filter: drop-shadow(0 0 15px var(--dns-soft)); }
        .timeline-track { height: 2px; background: linear-gradient(90deg, transparent, var(--dns-teal) 15%, var(--dns-teal) 85%, transparent); opacity: 0.2; }
        /* Animations */
        .radar-rotate { animation: rotate 5s linear infinite; transform-origin: center; }
        @keyframes geoMove { 0% { offset-distance: 0%; } 100% { offset-distance: 100%; } }
        .geo-tracker {
            position: absolute; top: 0; left: 0; width: 0; height: 0;
            offset-path: path('M -20,60 C 80,95 120,140 160,160 C 200,180 260,215 340,255');
            animation: geoMove 9s linear infinite;
        }
        @keyframes geoDotState {
            0%, 22%   { background-color: var(--dns-teal); box-shadow: 0 0 0 0 rgba(13,77,94,0); }
            30%, 70%  { background-color: var(--dns-primary); box-shadow: 0 0 0 6px rgba(13,77,94,0.15); }
            78%, 100% { background-color: var(--dns-teal); box-shadow: 0 0 0 0 rgba(13,77,94,0); }
        }
        .geo-tracker-dot {
            position: absolute; top: -11px; left: -11px; width: 22px; height: 22px;
            border-radius: 9999px; border: 4px solid #ffffff;
            animation: geoDotState 9s linear infinite;
        }
        @keyframes geoPulseState {
            0%, 24%   { opacity: 0; transform: scale(0.5); }
            30%, 70%  { opacity: 1; transform: scale(1); }
            76%, 100% { opacity: 0; transform: scale(0.5); }
        }
        .geo-tracker-pulse {
            position: absolute; top: -20px; left: -20px; width: 40px; height: 40px;
            border-radius: 9999px; border: 2px solid var(--dns-primary);
            animation: geoPulseState 9s linear infinite, blip 1.6s infinite;
        }
        @keyframes geoBadgeOn {
            0%, 24%   { opacity: 0; transform: translate(-50%, 6px); }
            30%, 70%  { opacity: 1; transform: translate(-50%, 0); }
            76%, 100% { opacity: 0; transform: translate(-50%, 6px); }
        }
        @keyframes geoBadgeOff {
            0%, 20%   { opacity: 1; transform: translate(-50%, 0); }
            26%, 74%  { opacity: 0; transform: translate(-50%, -6px); }
            80%, 100% { opacity: 1; transform: translate(-50%, 0); }
        }
        .geo-tracker-badge { position: absolute; top: -44px; left: 11px; font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; padding: 6px 14px; border-radius: 9999px; white-space: nowrap; }
        .geo-tracker-badge.on  { background-color: var(--dns-primary); color: var(--dns-soft); animation: geoBadgeOn 9s linear infinite; }
        .geo-tracker-badge.off { background-color: #ffffff; color: var(--dns-teal); border: 1.5px solid var(--dns-teal); animation: geoBadgeOff 9s linear infinite; }
        @keyframes geoBoundaryFlash {
            0%, 23%, 27%, 73%, 77%, 100% { border-color: rgba(65,116,131,0.1); }
            25%, 75% { border-color: rgba(13,77,94,0.5); }
        }
        .geo-boundary { animation: geoBoundaryFlash 9s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .shadow-3xl { box-shadow: 0 35px 60px -15px rgba(0, 0, 0, 0.3); }
        @keyframes blip { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.8); opacity: 0; } 100% { transform: scale(1); opacity: 0; } }
        .gps-blip { position: absolute; width: 12px; height: 12px; border-radius: 9999px; background-color: var(--dns-soft); box-shadow: 0 0 10px 2px rgba(170, 208, 209, 0.6); }
        .gps-blip::after { content: ''; position: absolute; inset: 0; border-radius: 9999px; background-color: var(--dns-soft); animation: blip 2s infinite; }
        [x-cloak] { display: none !important; }

        /* ============ LOGO ============ */
        .dns-logo-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
        .dns-logo { display: block; aspect-ratio: 835 / 315; height: auto; }
        .dns-lg-a { fill: #8FB9B8; }
        .dns-lg-b { fill: var(--dns-primary); }
        /* variante per fondo scuro */
        .dns-logo-inv .dns-lg-a { fill: var(--dns-soft); }
        .dns-logo-inv .dns-lg-b { fill: #FFFFFF; }

        /* ============ SCALA TIPOGRAFICA UNIFICATA ============ */
        .s-h1 { font-size: clamp(2.75rem, 6.2vw, 4.75rem); font-weight: 900; line-height: 0.9; letter-spacing: -0.035em; margin-bottom: 3rem; }
        .s-h2 { font-size: clamp(1.9rem, 3.4vw, 3rem); font-weight: 900; line-height: 1.03; letter-spacing: -0.03em; text-transform: uppercase; margin-bottom: 1.5rem; }
        .s-h2-solo { margin-bottom: 3.75rem; }
        .s-lead { font-size: clamp(1.05rem, 1.35vw, 1.3rem); font-weight: 300; line-height: 1.62; max-width: 46rem; margin-bottom: 3.5rem; }
        .s-lead-tight { margin-bottom: 2.5rem; }
        .s-stat { font-size: clamp(1.7rem, 2.6vw, 2.35rem); font-weight: 900; letter-spacing: -0.03em; line-height: 1.1; }

        /* ============ COMPARSA CON LO SCROLL ============ */
        [data-rv] {
            opacity: 0; transform: translateY(26px) scale(0.995);
            transition: opacity .75s cubic-bezier(.16,.84,.44,1), transform .75s cubic-bezier(.16,.84,.44,1);
            transition-delay: var(--rv-d, 0ms); will-change: opacity, transform;
        }
        [data-rv].rv-in { opacity: 1; transform: none; }
        @media (prefers-reduced-motion: reduce) {
            [data-rv], [data-rv].rv-in { opacity: 1 !important; transform: none !important; transition: none !important; }
            html { scroll-behavior: auto !important; }
        }

        /* ============ SCORRIMENTO ============ */
        html { scroll-snap-type: y proximity; }
        .slide-section { scroll-snap-align: start; scroll-snap-stop: normal; }

        /* barra di avanzamento */
        .progress-rail { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 120; background: rgba(13,77,94,0.08); }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--dns-teal), var(--dns-soft)); transition: width .15s linear; }

        /* pulsante autoplay */
        .ctrl-btn { transition: all .3s; }
        .ctrl-btn:hover { transform: scale(1.08); }
        @keyframes ringPulse { 0% { box-shadow: 0 0 0 0 rgba(170,208,209,.55); } 70% { box-shadow: 0 0 0 12px rgba(170,208,209,0); } 100% { box-shadow: 0 0 0 0 rgba(170,208,209,0); } }
        .ctrl-btn.playing { animation: ringPulse 2.2s infinite; }

        /* alleggerimento grafico: velo sfumato sulle slide chiare */
        .slide-section.bg-white::before,
        .slide-section.bg-dns-bg::before {
            content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 0;
            background: radial-gradient(120% 80% at 88% 8%, rgba(170,208,209,0.20), transparent 60%);
        }
        .slide-section > * { position: relative; z-index: 1; }
        /* Typographic scale for sub-headings/paragraphs (h3-h6, p) — 5 semantic roles, one size each. */
        .dns-eyebrow      { font-size: 0.6875rem; }
        .dns-item-title   { font-size: 0.9375rem; }
        .dns-item-desc    { font-size: 0.875rem; }
        .dns-detail-title { font-size: 1.875rem; }
        .dns-detail-desc  { font-size: 1.25rem; }
        .slide-dot { background-color: var(--dns-primary); border: 2px solid #ffffff; box-shadow: 0 0 0 1px rgba(8, 56, 69, 0.25); }
        /* Inspector: controller-assisted validation */
        @keyframes inspectorSweep { 0%,100% { opacity:.25; } 50% { opacity:1; } }
        .inspector-cone { animation: inspectorSweep 3s ease-in-out infinite; }
    </style>
</head>

                activeSlide: 1, totalSlides: 15,
                progress: 0, autoplay: false, autoTimer: null, autoMs: 15000,

                init() {
                    const sections = document.querySelectorAll('.slide-section[id^="slide-"]');
                    this.totalSlides = sections.length;

                    /* --- slide attiva --- */
                    const nav = new IntersectionObserver((entries) => {
                        entries.forEach(entry => {
                            if (entry.isIntersecting) {
                                this.activeSlide = parseInt(entry.target.id.replace('slide-', ''));
                            }
                        });
                    }, { rootMargin: '-50% 0px -50% 0px', threshold: 0 });
                    sections.forEach(el => nav.observe(el));

                    /* --- comparsa progressiva degli elementi --- */
                    const rv = new IntersectionObserver((entries) => {
                        entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('rv-in'); rv.unobserve(e.target); } });
                    }, { rootMargin: '0px 0px -12% 0px', threshold: 0.08 });

                    sections.forEach(sec => {
                        let targets = Array.from(sec.children);
                        // la prima slide ha un wrapper: scendi di un livello
                        if (targets.length && targets.length <= 2 && targets[0].children.length > 2) {
                            targets = Array.from(targets[0].children);
                        }
                        targets = targets.filter(el => !el.className || !String(el.className).includes('absolute'));
                        targets.forEach((el, i) => {
                            el.setAttribute('data-rv', '');
                            el.style.setProperty('--rv-d', Math.min(i * 95, 480) + 'ms');
                            rv.observe(el);
                        });
                    });

                    /* --- barra di avanzamento --- */
                    const upd = () => {
                        const h = document.documentElement.scrollHeight - window.innerHeight;
                        this.progress = h > 0 ? Math.min(100, (window.scrollY / h) * 100) : 0;
                    };
                    window.addEventListener('scroll', upd, { passive: true });
                    window.addEventListener('resize', upd);
                    upd();

                    /* --- tastiera --- */
                    window.addEventListener('keydown', (e) => {
                        if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') {
                            e.preventDefault(); this.stopAuto();
                            this.goToSlide(Math.min(this.activeSlide + 1, this.totalSlides));
                        } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
                            e.preventDefault(); this.stopAuto();
                            this.goToSlide(Math.max(this.activeSlide - 1, 1));
                        } else if (e.key === 'Escape') { this.stopAuto(); }
                    });

                    /* --- interazione manuale mette in pausa --- */
                    ['wheel', 'touchstart', 'mousedown'].forEach(ev =>
                        window.addEventListener(ev, () => { if (this.autoplay) this.stopAuto(); }, { passive: true })
                    );
                },

                goToSlide(n) {
                    document.getElementById('slide-' + n)?.scrollIntoView({ behavior: 'smooth' });
                },

                toggleAuto() { this.autoplay ? this.stopAuto() : this.startAuto(); },

                startAuto() {
                    this.autoplay = true;
                    this.autoTimer = setInterval(() => {
                        if (this.activeSlide >= this.totalSlides) { this.stopAuto(); return; }
                        this.goToSlide(this.activeSlide + 1);
                    }, this.autoMs);
                },

                    this.autoplay = false;

                            { icon: '<path d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>', t: "We know what we sell, not who skis", d: "We know the tickets sold. We do not know how many people are actually on the tracks, when, or in which area. Network decisions rest on estimates." },
