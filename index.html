<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNS Digital Infrastructure - Smart Slopes 2026</title>
    <!-- Tailwind & Alpine.js -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;700;900&family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --dns-primary: #0D4D5E;
            --dns-deep: #083845;
            --dns-teal: #417483;
            --dns-soft: #AAD0D1;
            --dns-bg: #F4F9F9;
        }
        body { font-family: 'Roboto', sans-serif; background-color: var(--dns-bg); color: var(--dns-primary); margin: 0; scroll-behavior: smooth; overflow-x: hidden; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Be Vietnam Pro', sans-serif; }
        
        /* Utility Colors */
        .bg-dns-primary { background-color: var(--dns-primary); }
        .bg-dns-deep { background-color: var(--dns-deep); }
        .text-dns-soft { color: var(--dns-soft); }
        .text-dns-teal { color: var(--dns-teal); }
        .border-dns-soft { border-color: var(--dns-soft); }

        /* Slide Layout */
        .slide-section { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 6rem 1.5rem; position: relative; border-bottom: 1px solid rgba(13, 77, 94, 0.05); }
        @media (min-width: 1024px) { .slide-section { padding: 4rem 10rem; } }

        /* Icon & Graphic Refinements */
        .wf-icon { fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        /* Architecture & Lifecycle Effects */
        .premium-card { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); border: 2px solid transparent; }
        .premium-card.active { border-color: var(--dns-soft); background: var(--dns-primary); color: white; transform: translateY(-5px); box-shadow: 0 25px 50px -12px rgba(13, 77, 94, 0.25); }
        .step-node { position: relative; z-index: 10; transition: all 0.4s; }
        .step-node.active { transform: scale(1.15); filter: drop-shadow(0 0 15px var(--dns-soft)); }
        .timeline-track { height: 2px; background: linear-gradient(90deg, transparent, var(--dns-teal) 15%, var(--dns-teal) 85%, transparent); opacity: 0.2; }

        /* Animations */
        .radar-rotate { animation: rotate 5s linear infinite; transform-origin: center; }
        @keyframes geoMove { 0% { offset-distance: 0%; } 100% { offset-distance: 100%; } }
        .geo-tracker {
            position: absolute; top: 0; left: 0; width: 0; height: 0;
            offset-path: path('M -20,60 C 80,95 120,140 160,160 C 200,180 260,215 340,255');
            animation: geoMove 9s linear infinite;
        }
        @keyframes geoDotState {
            0%, 22%   { background-color: var(--dns-teal); box-shadow: 0 0 0 0 rgba(13,77,94,0); }
            30%, 70%  { background-color: var(--dns-primary); box-shadow: 0 0 0 6px rgba(13,77,94,0.15); }
            78%, 100% { background-color: var(--dns-teal); box-shadow: 0 0 0 0 rgba(13,77,94,0); }
        }
        .geo-tracker-dot {
            position: absolute; top: -11px; left: -11px; width: 22px; height: 22px;
            border-radius: 9999px; border: 4px solid #ffffff;
            animation: geoDotState 9s linear infinite;
        }
        @keyframes geoPulseState {
            0%, 24%   { opacity: 0; transform: scale(0.5); }
            30%, 70%  { opacity: 1; transform: scale(1); }
            76%, 100% { opacity: 0; transform: scale(0.5); }
        }
        .geo-tracker-pulse {
            position: absolute; top: -20px; left: -20px; width: 40px; height: 40px;
            border-radius: 9999px; border: 2px solid var(--dns-primary);
            animation: geoPulseState 9s linear infinite, blip 1.6s infinite;
        }
        @keyframes geoBadgeOn {
            0%, 24%   { opacity: 0; transform: translate(-50%, 6px); }
            30%, 70%  { opacity: 1; transform: translate(-50%, 0); }
            76%, 100% { opacity: 0; transform: translate(-50%, 6px); }
        }
        @keyframes geoBadgeOff {
            0%, 20%   { opacity: 1; transform: translate(-50%, 0); }
            26%, 74%  { opacity: 0; transform: translate(-50%, -6px); }
            80%, 100% { opacity: 1; transform: translate(-50%, 0); }
        }
        .geo-tracker-badge { position: absolute; top: -44px; left: 11px; font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; padding: 6px 14px; border-radius: 9999px; white-space: nowrap; }
        .geo-tracker-badge.on  { background-color: var(--dns-primary); color: var(--dns-soft); animation: geoBadgeOn 9s linear infinite; }
        .geo-tracker-badge.off { background-color: #ffffff; color: var(--dns-teal); border: 1.5px solid var(--dns-teal); animation: geoBadgeOff 9s linear infinite; }
        @keyframes geoBoundaryFlash {
            0%, 23%, 27%, 73%, 77%, 100% { border-color: rgba(65,116,131,0.1); }
            25%, 75% { border-color: rgba(13,77,94,0.5); }
        }
        .geo-boundary { animation: geoBoundaryFlash 9s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .shadow-3xl { box-shadow: 0 35px 60px -15px rgba(0, 0, 0, 0.3); }
        @keyframes blip { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.8); opacity: 0; } 100% { transform: scale(1); opacity: 0; } }
        .gps-blip { position: absolute; width: 12px; height: 12px; border-radius: 9999px; background-color: var(--dns-soft); box-shadow: 0 0 10px 2px rgba(170, 208, 209, 0.6); }
        .gps-blip::after { content: ''; position: absolute; inset: 0; border-radius: 9999px; background-color: var(--dns-soft); animation: blip 2s infinite; }

        [x-cloak] { display: none !important; }

        /* Typographic scale for sub-headings/paragraphs (h3-h6, p) — 5 semantic roles, one size each,
           applied identically across all 9 slides regardless of markup/DOM position. */
        .dns-eyebrow      { font-size: 0.6875rem; }  /* tracked micro-labels above/below content */
        .dns-item-title   { font-size: 0.9375rem; }  /* titles inside clickable cards / list items */
        .dns-item-desc    { font-size: 0.875rem; }   /* description text inside clickable cards / list items */
        .dns-detail-title { font-size: 1.875rem; }   /* titles inside always-visible "master-detail" panels */
        .dns-detail-desc  { font-size: 1.25rem; }    /* description text inside "master-detail" panels */
        .slide-dot { background-color: var(--dns-primary); border: 2px solid #ffffff; box-shadow: 0 0 0 1px rgba(8, 56, 69, 0.25); }
    </style>
</head>

               :class="activeSlide === n ? 'w-3.5 h-3.5' : 'w-2 h-2'"
               :style="activeSlide === n ? 'border-color: var(--dns-soft)' : ''"
               :title="'Slide ' + n"></a>

    <!-- Slide 1: VISION -->
    <section id="slide-1" class="slide-section bg-dns-primary text-white overflow-hidden">
        <div class="max-w-5xl z-10">
            <h6 class="text-dns-soft font-black tracking-[0.6em] uppercase mb-8 dns-eyebrow opacity-80" x-text="content[lang].s1_tag"></h6>
            <h1 class="text-5xl md:text-7xl font-black mb-12 leading-[0.85] tracking-tighter" x-html="content[lang].s1_title"></h1>
            <div class="flex items-center space-x-6 mb-10">
                <div class="h-[3px] w-16 bg-dns-soft rounded-full"></div>
                <span class="text-dns-soft font-black tracking-[0.4em] uppercase text-sm">Smart Slopes Concept</span>
            </div>
            <p class="text-xl md:text-3xl text-dns-soft/60 font-light max-w-3xl leading-relaxed" x-text="content[lang].s1_desc"></p>
        </div>
        <div class="absolute right-[-10%] bottom-[-10%] opacity-[0.03] w-2/3 h-full pointer-events-none">
            <svg viewBox="0 0 100 100" fill="white"><path d="M0 100 L100 100 L100 0 Z"/></svg>
        </div>
    </section>

    <!-- Slide 2: ARCHITETTURA STRATEGICA -->
    <section id="slide-2" class="slide-section bg-white">
        <h2 class="text-4xl md:text-5xl font-black mb-16 text-dns-primary uppercase tracking-tighter" x-text="content[lang].s2_title"></h2>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
            <div class="space-y-4">
                <template x-for="(l, i) in content[lang].s2_layers">
                    <div @click="activeLayer = i" 
                         class="premium-card p-6 rounded-[2rem] border-2 cursor-pointer transition-all flex items-center justify-between"
                         :class="activeLayer === i ? 'active shadow-2xl' : 'bg-dns-bg border-dns-soft/10 text-dns-primary hover:border-dns-teal/30'">
                        <div class="flex items-center space-x-6">
                            <div class="p-3 rounded-2xl" :class="activeLayer === i ? 'bg-white/10' : 'bg-dns-primary/5'">
                                <svg class="w-10 h-10 wf-icon" :class="activeLayer === i ? 'text-white' : 'text-dns-primary'" viewBox="0 0 24 24" x-html="l.icon"></svg>
                            </div>
                            <h4 class="font-black dns-item-title uppercase tracking-widest" x-text="l.title"></h4>
                        </div>
                        <span class="text-3xl font-black opacity-10" x-text="'0'+(i+1)"></span>
                    </div>
                </template>
            </div>
            <div class="bg-dns-deep text-white p-12 rounded-[4rem] shadow-2xl min-h-[450px] flex flex-col justify-center relative border-b-[12px] border-dns-soft">
                <div class="absolute top-0 right-0 p-12 opacity-5">
                    <svg class="w-40 h-40 wf-icon text-white" viewBox="0 0 24 24" x-html="content[lang].s2_layers[activeLayer].icon"></svg>
                </div>
                <h3 class="text-dns-soft font-black dns-detail-title mb-8 uppercase tracking-tighter" x-text="content[lang].s2_layers[activeLayer].title"></h3>
                <p class="dns-detail-desc font-light leading-relaxed opacity-80" x-text="content[lang].s2_layers[activeLayer].desc"></p>
                <div class="mt-10 pt-10 border-t border-white/10 flex items-center space-x-4">
                    <div class="w-2 h-2 rounded-full bg-dns-soft animate-ping"></div>
                    <span class="text-xs font-black uppercase tracking-[0.3em] text-dns-teal" x-text="activeLayer === 0 ? 'LTS Governance' : 'DNS Sovereignty'"></span>
                </div>
            </div>
        </div>
    </section>

    <!-- Slide 3: CICLO DI VITA -->
    <section id="slide-3" class="slide-section bg-dns-deep text-white">
        <h2 class="text-4xl md:text-5xl font-black mb-24 text-dns-soft uppercase tracking-widest text-center" x-text="content[lang].s3_title"></h2>
        <div class="max-w-7xl mx-auto w-full">
            <div class="relative flex flex-col md:flex-row items-center justify-between gap-12 md:gap-0 px-10">
                <div class="absolute timeline-track w-full top-12 hidden md:block"></div>
                <template x-for="(step, i) in content[lang].s3_steps">
                    <div class="relative z-10 flex flex-col items-center w-full">
                        <button @click="activeStep = i" 
                                class="w-24 h-24 rounded-full border-4 flex items-center justify-center transition-all step-node"
                                :class="activeStep === i ? 'bg-dns-soft border-white scale-125' : 'bg-dns-primary border-dns-teal/30 hover:border-dns-soft/50'">
                            <svg class="w-10 h-10 wf-icon" :class="activeStep === i ? 'text-dns-primary' : 'text-dns-soft'" viewBox="0 0 24 24" x-html="step.icon"></svg>
                        </button>
                        <p class="mt-8 dns-eyebrow font-black uppercase tracking-widest text-center max-w-[100px]" :class="activeStep === i ? 'text-white' : 'text-dns-teal'" x-text="step.label"></p>
                    </div>
                </template>
            </div>
            <div class="max-w-4xl mx-auto mt-24 p-12 bg-dns-primary/40 border border-dns-soft/10 rounded-[3.5rem] shadow-3xl text-center backdrop-blur-md">
                <div class="inline-block px-5 py-1.5 bg-dns-soft text-dns-primary rounded-full text-[10px] font-black uppercase mb-6 shadow-lg" x-text="'Stage 0' + (activeStep + 1)"></div>
                <h4 class="text-white font-black dns-detail-title mb-6 uppercase tracking-tighter" x-text="content[lang].s3_steps[activeStep].label"></h4>
                <p class="dns-detail-desc text-dns-soft/90 font-light leading-relaxed max-w-2xl mx-auto" x-text="content[lang].s3_steps[activeStep].detail"></p>
            </div>
        </div>
    </section>

    <!-- Slide 4: GEOFENCING -->
    <section id="slide-4" class="slide-section bg-white">
        <h2 class="text-4xl md:text-5xl font-black mb-16 text-dns-primary uppercase tracking-tighter" x-text="content[lang].s4_title"></h2>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-20 items-center">
            <div class="space-y-6">
                <template x-for="(p, i) in content[lang].s4_points">
                    <button @click="activeGeo = i" class="w-full flex items-start space-x-6 p-6 rounded-[2.5rem] border-2 transition-all text-left group"
                            :class="activeGeo === i ? 'bg-dns-primary text-white border-dns-primary shadow-2xl' : 'bg-dns-bg border-dns-soft/10 text-dns-primary hover:border-dns-teal/40'">
                        <div class="p-3 rounded-2xl transition-colors" :class="activeGeo === i ? 'bg-white/10' : 'bg-dns-primary/5 group-hover:bg-dns-teal/10'">
                            <svg class="w-8 h-8 wf-icon flex-shrink-0" viewBox="0 0 24 24" x-html="p.icon"></svg>
                        </div>
                        <div>
                            <h4 class="font-black uppercase dns-item-title" x-text="p.t"></h4>
                            <p class="dns-item-desc opacity-70 mt-2 font-light leading-snug" x-text="p.d" x-show="activeGeo === i"></p>
                        </div>
                    </button>

            </div>
            <div class="h-[500px] bg-dns-bg rounded-[4rem] relative flex items-center justify-center border border-dns-soft/20 shadow-2xl overflow-hidden">

                    <svg viewBox="0 0 320 320" class="absolute inset-0 w-full h-full overflow-visible pointer-events-none">

                        <div class="geo-tracker-badge on">GPS Tracking ON</div>
                        <div class="geo-tracker-badge off">No Signal</div>

                        <div class="geo-tracker-dot"></div>
                    </div>
                </div>
            </div>
        </div>
